    <div class="card" style="margin:7% 2%">
        <h5 class="card-title">Result:</h5>
        <div class="card-body" style="display: flex; align-items: center; justify-content: space-between;">
            <p class="card-text" id="result" style="max-width: 90%;"></p>
            <button type="button" class="btn btn-copy" id="btn_copy" onclick="copyToClipboard()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"></path>
                </svg>
            </button>

        </div>
    </div>

    <script>
        function copyToClipboard(){
            btn_copy = document.getElementById("btn_copy");
            btn_copy.addEventListener('click', () => {
                const textToCopy = btn_copy.previousElementSibling.textContent.trim();
                console.log(textToCopy)
                navigator.clipboard.writeText(textToCopy)
            });
            
        }

        function usePlaceholderAsValue(id) {
            // Get the input field
            const inputField = document.getElementById(id.split("_")[1]);
            // Check if the input is empty
            if (inputField.value === '') {
                // Use the placeholder as the value
                inputField.value = inputField.placeholder;
            } else {
                alert("Input field already has a value!");
            }
        }

        // Handle form submission
        document.getElementById('python-form').addEventListener('submit', function(event) {
            event.preventDefault();

            // Get form data
            const formData = new FormData(this);
            const data = {
                acl: "/*",
                window_seconds: formData.get('window_seconds')
            };

            // Send the data to the back-end
            fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)

                })
                .then(response => response.json())
                .then(result => {
                    // Output the result
                    domain = document.getElementById('url_domain').value
                    path = document.getElementById('url_path').value
                    token = result.output.split('\n')[1]
                    document.getElementById('result').innerHTML = domain + path + "?forceRCOne=true&" + token
                    //alert('Script ran successfully! Output: ' + result.output);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error running script.');
                });
        });
    </script>
